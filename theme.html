<!doctype html>
<html><head><meta charset="utf-8"><title>Singify UI themes</title>
<!-- Singify theme.html: every UI theme lives here so index.html stays small.
     A theme = palette + corner shapes + font + animation speed/feel.
     Add a new theme: add one block in <style> and one line in the JSON list below.
     The Colour UI (accent colour) still works on top of every theme. -->
<style>
/* shared hooks: --ur = corner radius, --ease = animation feel, --pd = page animation time */
html[data-ui]{--pd:.3s}
html[data-ui] .card img,html[data-ui] .skc,html[data-ui] .btn,html[data-ui] #bar,html[data-ui] .sheet>div,html[data-ui] #dlg>div,html[data-ui] #qp{border-radius:var(--ur,18px)}
html[data-ui] .pg{animation-duration:var(--pd)}

/* 1. Neon: dark violet, sharp corners, glowing lines, snappy */
html[data-ui=neon]{--ur:8px;--pd:.18s;--ease:cubic-bezier(.2,1,.3,1)}
html[data-ui=neon]:not([data-theme=light]){--bg:#05010f;--ps:#0d0524;--panel:rgba(20,6,48,.72);--card:rgba(150,80,255,.1);--line:rgba(180,110,255,.35);--tx:#f6eeff;--mut:#b49be0;--g1:rgba(170,90,255,.16);--g2:rgba(60,20,120,.06);--gb:rgba(190,120,255,.5);--gh:rgba(230,190,255,.55);--sh:rgba(150,60,255,.45)}
html[data-ui=neon] .card,html[data-ui=neon] .skc,html[data-ui=neon] #bar{box-shadow:0 0 18px rgba(160,80,255,.28)}

/* 2. Amoled: pure black, flat, no blur, very fast */
html[data-ui=amoled]{--ur:14px;--pd:.14s;--ease:cubic-bezier(.3,0,.2,1)}
html[data-ui=amoled]:not([data-theme=light]){--bg:#000;--ps:#000;--panel:#050505;--card:#0e0e10;--line:#202024;--tx:#fff;--mut:#8a8a93;--g1:#0e0e10;--g2:#0e0e10;--gb:#26262b;--gh:transparent;--sh:transparent}
html[data-ui=amoled] *{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
html[data-ui=amoled] body::before{background:#000!important}

/* 3. Forest: deep green, big soft corners, slow floaty motion */
html[data-ui=forest]{--ur:28px;--pd:.55s;--ease:cubic-bezier(.16,.84,.3,1)}
html[data-ui=forest]:not([data-theme=light]){--bg:#04100a;--ps:#0a2015;--panel:rgba(12,40,26,.7);--card:rgba(120,230,160,.08);--line:rgba(140,230,170,.16);--tx:#e9fff0;--mut:#8fb9a0;--g1:rgba(120,230,160,.12);--g2:rgba(40,120,70,.05);--gb:rgba(150,235,180,.22);--gh:rgba(210,255,225,.3);--sh:rgba(0,30,10,.5)}

/* 4. Liquid Glass: translucent blue-violet surfaces, restrained blur for smooth performance */
html[data-ui=liquid]{--ur:24px;--pd:.22s;--ease:cubic-bezier(.2,.8,.2,1)}
html[data-ui=liquid]:not([data-theme=light]){--bg:#080d1b;--ps:#101a30;--panel:rgba(25,38,66,.76);--card:rgba(160,190,255,.09);--line:rgba(180,205,255,.2);--tx:#f4f7ff;--mut:#a7b5d4;--g1:rgba(110,140,255,.13);--g2:rgba(70,100,200,.05);--gb:rgba(180,205,255,.28);--gh:rgba(220,230,255,.35);--sh:rgba(4,10,30,.35)}
html[data-ui=liquid] #bar,html[data-ui=liquid] #tabs,html[data-ui=liquid] .sheet>div{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

/* 5. Candy: plum pink, extra round, bouncy */
html[data-ui=candy]{--ur:32px;--pd:.28s;--ease:cubic-bezier(.2,.8,.2,1)}
html[data-ui=candy]:not([data-theme=light]){--bg:#1b0a24;--ps:#2d1040;--panel:rgba(60,20,80,.72);--card:rgba(255,130,200,.12);--line:rgba(255,150,210,.28);--tx:#fff0fa;--mut:#d9a5cf;--g1:rgba(255,130,200,.2);--g2:rgba(150,60,200,.08);--gb:rgba(255,170,220,.4);--gh:rgba(255,220,240,.45);--sh:rgba(120,20,90,.4)}

/* 6. Ice: cold navy-teal, light glass, restrained blur */
html[data-ui=ice]{--ur:22px;--pd:.22s;--ease:cubic-bezier(.25,.8,.25,1)}
html[data-ui=ice]:not([data-theme=light]){--bg:#03111a;--ps:#08283a;--panel:rgba(10,50,72,.7);--card:rgba(160,225,255,.1);--line:rgba(170,230,255,.2);--tx:#eafaff;--mut:#8fb8cc;--g1:rgba(170,230,255,.14);--g2:rgba(60,150,200,.06);--gb:rgba(190,240,255,.3);--gh:rgba(230,250,255,.45);--sh:rgba(0,40,70,.4)}
html[data-ui=ice] #bar,html[data-ui=ice] #tabs,html[data-ui=ice] .sheet>div{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

/* 7. Sunset: warm orange, rose and deep navy */
html[data-ui=sunset]{--ur:18px;--pd:.2s;--ease:cubic-bezier(.2,.8,.2,1)}
html[data-ui=sunset]:not([data-theme=light]){--bg:#180d18;--ps:#2b1424;--panel:rgba(55,25,38,.78);--card:rgba(255,160,110,.1);--line:rgba(255,170,130,.22);--tx:#fff4ed;--mut:#d5aaa0;--g1:rgba(255,130,80,.14);--g2:rgba(120,40,70,.06);--gb:rgba(255,175,130,.28);--gh:rgba(255,220,190,.32);--sh:rgba(20,5,15,.4)}

/* 8. Midnight Blue: crisp blue-black, flat and efficient */
html[data-ui=midnight]{--ur:16px;--pd:.16s;--ease:cubic-bezier(.2,.7,.2,1)}
html[data-ui=midnight]:not([data-theme=light]){--bg:#060b16;--ps:#0b1426;--panel:#101c31;--card:#101b2d;--line:#263a59;--tx:#edf4ff;--mut:#91a7c7;--g1:#101b2d;--g2:#0b1426;--gb:#2a4164;--gh:transparent;--sh:rgba(0,0,0,.3)}
html[data-ui=midnight] *{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}

/* 9. Lavender: calm lilac and charcoal, clean modern surfaces */
html[data-ui=lavender]{--ur:20px;--pd:.2s;--ease:cubic-bezier(.2,.8,.2,1)}
html[data-ui=lavender]:not([data-theme=light]){--bg:#100d1c;--ps:#1c1730;--panel:rgba(35,28,57,.82);--card:rgba(190,160,255,.09);--line:rgba(190,170,255,.2);--tx:#f7f2ff;--mut:#b6a9d3;--g1:rgba(170,130,255,.13);--g2:rgba(100,70,170,.05);--gb:rgba(200,180,255,.25);--gh:rgba(230,220,255,.3);--sh:rgba(10,5,25,.4)}

</style></head>
<body>
<script type="application/json" id="uithemes">
[
 {"id":"neon","name":"Neon","desc":"Glowing violet, sharp and snappy","sw":"linear-gradient(135deg,#b45cff,#2a0a5e)"},
 {"id":"amoled","name":"Amoled","desc":"Pure black, flat and fast","sw":"linear-gradient(135deg,#2a2a2e,#000)"},
 {"id":"forest","name":"Forest","desc":"Deep green, soft and natural","sw":"linear-gradient(135deg,#5fe39a,#0a2a1a)"},
 {"id":"liquid","name":"Liquid Glass","desc":"Blue-violet glass with subtle blur","sw":"linear-gradient(135deg,#b6c5ff,#222e65)"},
 {"id":"candy","name":"Candy","desc":"Plum pink, round and playful","sw":"linear-gradient(135deg,#ff7ac8,#4a1466)"},
 {"id":"ice","name":"Ice","desc":"Cool teal, clean glass","sw":"linear-gradient(135deg,#7fdcff,#08283a)"},
 {"id":"sunset","name":"Sunset","desc":"Warm rose and amber glow","sw":"linear-gradient(135deg,#ffb06b,#6b2145)"},
 {"id":"midnight","name":"Midnight Blue","desc":"Crisp blue-black, extra smooth","sw":"linear-gradient(135deg,#5d8edb,#060b16)"},
 {"id":"lavender","name":"Lavender","desc":"Soft lilac with elegant dark surfaces","sw":"linear-gradient(135deg,#c9a8ff,#30234f)"}
]
</script>
</body></html>
