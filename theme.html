<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Singify UI themes</title>

/* Singify theme.html - 8 full UI themes. Each one changes shapes, fonts, nav bar, player bar, rows, headings and background.
