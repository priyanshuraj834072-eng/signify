<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a08">
<title>Singify</title>
<style>
:root{--bg:#0b0a08;--panel:#14120e;--card:#1b1812;--line:#2a251a;--gold:#f5b82e;--gold2:#c98a12;--tx:#f4efe4;--mut:#9a927f;--bar:84px;--nav:58px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Roboto,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
body{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
input{user-select:text;-webkit-user-select:text}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;outline:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg{width:24px;height:24px;fill:currentColor;display:block}
#app{display:grid;grid-template-columns:240px 1fr;height:100%;padding-bottom:var(--bar)}
#side{background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:800;color:var(--gold);padding:0 10px 22px;letter-spacing:.5px}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:grid;place-items:center;color:#1a1204;font-style:normal;font-size:18px}
.nl{display:flex;align-items:center;gap:14px;padding:11px 12px;border-radius:10px;color:var(--mut);font-weight:600}
.nl.on{background:linear-gradient(90deg,#3a2c0b,#1d1808);color:var(--tx)}
.nl.on svg{color:var(--gold)}
.sh{margin:22px 12px 8px;font-size:12px;color:var(--mut)}
.pl{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:10px}
.pl:hover{background:var(--card)}
.pl b{display:block;font-size:14px;font-weight:600}.pl small{color:var(--mut);font-size:12px}
.th{width:42px;height:42px;border-radius:8px;object-fit:cover;background:var(--card);flex:none}
.liked{background:linear-gradient(135deg,#6b4cff,#3d2bd1);display:grid;place-items:center;color:#fff}
#main{overflow:auto;padding:22px 28px 30px;scroll-behavior:auto}
h1{font-size:30px;margin-bottom:16px}
h2{font-size:19px;margin:28px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
h1 em{color:var(--gold);font-style:normal}
.chips{display:flex;gap:8px;margin-bottom:18px;overflow:auto}
.chip{padding:7px 16px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.chip.on{background:var(--gold);color:#1a1204;font-weight:700;border-color:var(--gold)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tile{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:10px;overflow:hidden;font-weight:600;font-size:14px;padding-right:8px}
.tile .th{width:54px;height:54px;border-radius:0}
.scroll{display:flex;gap:14px;overflow:auto;padding-bottom:6px}
.card{flex:none;width:150px}
.card img,.card .ph{width:150px;height:150px;border-radius:12px;object-fit:cover;background:var(--card);margin-bottom:8px}
.card b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card small{color:var(--mut);font-size:12px}
.mix{flex:none;width:260px;height:96px;border-radius:14px;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;font-weight:700;border:1px solid var(--line)}
.mix small{font-weight:400;color:#ffffffb0;font-size:12px}
.genre{flex:none;width:130px;height:130px;border-radius:12px;padding:12px;font-weight:700;display:flex;align-items:flex-end;border:1px solid var(--gold2)}
.art{flex:none;width:96px;text-align:center;font-size:13px}
.art i{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:34px;font-weight:800;font-style:normal;color:#1a1204;background:linear-gradient(135deg,var(--gold),var(--gold2));margin-bottom:8px}
.song{display:grid;grid-template-columns:28px 46px 1fr auto 40px;gap:12px;align-items:center;padding:8px 6px;border-radius:10px;cursor:pointer}
.song:hover{background:var(--card)}
.song.cur .t{color:var(--gold)}
.song .n{color:var(--mut);text-align:center;font-size:14px}
.song .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .a{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .d{color:var(--mut);font-size:13px}
.song .th{width:46px;height:46px}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--mut)}
.ib.on{color:var(--gold)}
.ib svg{width:22px;height:22px}
.head{display:flex;gap:20px;align-items:flex-end;margin-bottom:18px}
.head img,.head .ph{width:170px;height:170px;border-radius:14px;object-fit:cover;background:var(--card);flex:none}
.head p{color:var(--mut);font-size:14px;margin-top:6px}
.go{display:inline-flex;align-items:center;gap:6px;background:var(--gold);color:#1a1204;font-weight:700;padding:10px 24px 10px 14px;border-radius:99px;margin-top:14px}
.sb{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:0 16px;height:46px;margin-bottom:18px}
.sb input{flex:1;background:none;border:0;color:var(--tx);font-size:16px;outline:0;height:100%}
.msg{color:var(--mut);padding:30px 0;text-align:center}
.sk{height:56px;border-radius:10px;background:linear-gradient(90deg,var(--card),#23201a,var(--card));background-size:200%;animation:sk 1.2s infinite;margin-bottom:8px}
@keyframes sk{to{background-position:-200%}}
/* player bar */
#bar{position:fixed;left:0;right:0;bottom:0;height:var(--bar);background:#100e0a;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1.4fr 1fr;align-items:center;padding:0 16px;z-index:20}
#bar .info{display:flex;gap:12px;align-items:center;min-width:0;cursor:pointer}
#bar .info div{min-width:0}
#bar .info b,#bar .info small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .info small{color:var(--mut)}
.ctl{display:flex;flex-direction:column;align-items:center;gap:4px}
.btns{display:flex;align-items:center;gap:8px}
.pp{width:46px;height:46px;border-radius:50%;background:var(--gold);color:#1a1204;display:grid;place-items:center}
.seek{display:flex;align-items:center;gap:10px;width:100%;font-size:11px;color:var(--mut)}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--gold) var(--p,0%),#3a3426 var(--p,0%));outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--gold)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--gold)}
#bar .r{display:flex;justify-content:flex-end}
#tabs{display:none}
/* full player */
#now{position:fixed;inset:0;z-index:40;background:radial-gradient(120% 60% at 50% 0,#3a2a08,var(--bg) 70%);display:none;flex-direction:column;align-items:center;padding:14px 26px calc(24px + env(safe-area-inset-bottom));overflow:auto}
body.now #now{display:flex}
#now .top{width:100%;max-width:440px;display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:13px}
#now .cov{width:100%;max-width:380px;aspect-ratio:1;border-radius:18px;object-fit:cover;margin:22px 0;box-shadow:0 20px 60px #000a;background:var(--card)}
#now .meta{width:100%;max-width:380px;display:flex;justify-content:space-between;align-items:center}
#now .meta b{font-size:22px;display:block}#now .meta small{color:var(--mut);font-size:15px}
#now .seek{max-width:380px;margin:18px 0 8px}
#now .btns{gap:18px;margin-top:10px}
#now .pp{width:68px;height:68px}#now .pp svg{width:34px;height:34px}
#now .btns .ib svg{width:28px;height:28px}
#toast{position:fixed;left:50%;bottom:calc(var(--bar) + 20px);transform:translateX(-50%);background:var(--card);border:1px solid var(--gold2);padding:10px 18px;border-radius:99px;font-size:14px;z-index:60;display:none}
@media(max-width:800px){
 #app{grid-template-columns:1fr;padding-bottom:calc(var(--bar) + var(--nav))}
 #side{display:none}
 #main{padding:16px 16px 24px}
 h1{font-size:25px}
 :root{--bar:64px}
 #bar{bottom:var(--nav);grid-template-columns:1fr auto;height:var(--bar);background:#1c1810;margin:0 8px;left:0;right:0;border:1px solid var(--line);border-radius:14px;padding:0 8px 0 10px}
 #bar .ctl{display:contents}
 #bar .seek,#bar .r,#bar .btns .sec{display:none}
 #bar .pp{width:40px;height:40px}
 #tabs{display:flex;position:fixed;bottom:0;left:0;right:0;height:var(--nav);background:#100e0a;border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
 #tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--mut)}
 #tabs a.on{color:var(--gold)}
 .head{flex-direction:column;align-items:flex-start}
 .head img,.head .ph{width:150px;height:150px}
 .song{grid-template-columns:46px 1fr 40px}
 .song .n,.song .d{display:none}
 .mix{width:230px}
 #toast{bottom:calc(var(--bar) + var(--nav) + 18px)}
}
</style>
</head>
<body>
<div id="app">
 <aside id="side">
  <div class="logo"><i>♪</i>Singify</div>
  <a class="nl" data-nav="home" href="#/home"><svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>Home</a>
  <a class="nl" data-nav="search" href="#/search"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>Search</a>
  <a class="nl" data-nav="library" href="#/library"><svg viewBox="0 0 24 24"><path d="M4 4h2v16H4zM8 4h2v16H8zM12.5 5.5l1.9-.5 4 15-1.9.5z"/></svg>Your Library</a>
  <div class="sh">YOUR PLAYLISTS</div>
  <div id="sidepl"></div>
 </aside>
 <main id="main"></main>
</div>
<footer id="bar">
 <div class="info" data-act="open"><img class="th" id="bimg" alt=""><div><b id="bt">Nothing playing</b><small id="ba">Pick a song</small></div></div>
 <div class="ctl">
  <div class="btns">
   <button class="ib sec" data-act="shuf" id="bshuf" aria-label="Shuffle"></button>
   <button class="ib" data-act="prev" aria-label="Previous"></button>
   <button class="pp" data-act="pp" id="bpp" aria-label="Play or pause"></button>
   <button class="ib" data-act="next" aria-label="Next"></button>
   <button class="ib sec" data-act="rep" id="brep" aria-label="Repeat"></button>
  </div>
  <div class="seek"><span id="bc">0:00</span><input type="range" min="0" max="1000" value="0" id="bs" aria-label="Seek"><span id="bd">0:00</span></div>
 </div>
 <div class="r"><button class="ib" data-like="cur" id="blike" aria-label="Like"></button></div>
</footer>
<nav id="tabs">
 <a data-nav="home" href="#/home" id="t1"><span></span>Home</a>
 <a data-nav="search" href="#/search" id="t2"><span></span>Search</a>
 <a data-nav="library" href="#/library" id="t3"><span></span>Your Library</a>
</nav>
<section id="now">
 <div class="top"><button class="ib" data-act="close" aria-label="Close" id="nclose"></button><span>Playing from Singify</span><span style="width:40px"></span></div>
 <img class="cov" id="nimg" alt="">
 <div class="meta"><div><b id="nt"></b><small id="na"></small></div><button class="ib" data-like="cur" id="nlike" aria-label="Like"></button></div>
 <div class="seek"><span id="nc">0:00</span><input type="range" min="0" max="1000" value="0" id="ns" aria-label="Seek"><span id="nd">0:00</span></div>
 <div class="btns">
  <button class="ib" data-act="shuf" id="nshuf" aria-label="Shuffle"></button>
  <button class="ib" data-act="prev" aria-label="Previous"></button>
  <button class="pp" data-act="pp" id="npp" aria-label="Play or pause"></button>
  <button class="ib" data-act="next" aria-label="Next"></button>
  <button class="ib" data-act="rep" id="nrep" aria-label="Repeat"></button>
 </div>
</section>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),main=$('#main');
const IC={play:'M8 5v14l11-7z',pause:'M6 5h4v14H6zM14 5h4v14h-4z',next:'M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z',prev:'M6 6h2v12H6zM9.5 12l8.5 6V6z',heart:'M12 21l-1.4-1.3C5.4 15.1 2 12 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.5-3.4 6.6-8.6 11.2L12 21z',heartO:'M16.5 3c-1.7 0-3.4.8-4.5 2.1C10.9 3.8 9.2 3 7.5 3 4.4 3 2 5.4 2 8.5c0 3.5 3.4 6.6 8.6 11.2l1.4 1.3 1.4-1.3C18.6 15.1 22 12 22 8.5 22 5.4 19.6 3 16.5 3zm-4.4 15.6l-.1.1-.1-.1C7.1 14.2 4 11.4 4 8.5 4 6.5 5.5 5 7.5 5c1.5 0 3 1 3.6 2.4h1.8C13.5 6 15 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.9-3.1 5.7-7.9 10.1z',shuf:'M10.6 9.2L4 2.6 2.6 4l6.6 6.6 1.4-1.4zM14.5 4l2.5 2.5L2.6 20.9 4 22.3 18.4 7.9 21 10.5V4h-6.5zM14.8 13.4l-1.4 1.4 3.6 3.6L14.5 21H21v-6.5l-2.5 2.5-3.7-3.6z',rep:'M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z',home:'M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z',search:'M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z',lib:'M4 4h2v16H4zM8 4h2v16H8zM12.5 5.5l1.9-.5 4 15-1.9.5z',down:'M7 10l5 5 5-5z'};
const ic=n=>`<svg viewBox="0 0 24 24"><path d="${IC[n]}"/></svg>`;
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dec=t=>{const e=document.createElement('textarea');e.innerHTML=t||'';return e.value};
const fm=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const enc=encodeURIComponent;
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const PL=[['Chill Vibes','chill hindi songs','#2b3a67'],['Workout Mix','workout gym songs','#7a3b12'],['Punjabi Hits','punjabi hits','#5c2a1a'],['Road Trip','road trip hindi songs','#124a52'],['Arijit Singh Mix','arijit singh','#4a3a12'],['Atif Aslam Mix','atif aslam','#3a2a4a']];
const ARTISTS=['Arijit Singh','Atif Aslam','Shreya Ghoshal','Darshan Raval','Jubin Nautiyal','Pritam','Neha Kakkar','B Praak'];
const GENRES=[['Pop','english pop hits','#4b2a7a'],['Bollywood','bollywood hits','#6b3a0a'],['Punjabi','punjabi songs','#7a4a0a'],['Indie','indie hindi songs','#2a3a2a'],['Workout','workout songs','#6b2a0a'],['Chill','lofi chill songs','#1a3a5a']];
const MIXES=[['Daily Mix 1','Arijit Singh, Pritam, KK','arijit singh top songs','#5a3a10'],['Daily Mix 2','Shreya Ghoshal, Amit Trivedi','shreya ghoshal hits','#5a1f4a'],['Daily Mix 3','Darshan Raval, Jubin Nautiyal','darshan raval jubin nautiyal','#0f4a52']];
let C={},lists={},liked=ls('sg_liked',[]),Q=[],qi=-1,shuf=false,rep=false,SC={};
const A=new Audio();A.preload='auto';
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)};
/* ---- API (goes through /api/music so MUSIC_API_URL stays in Vercel) ---- */
async function api(p,params){const r=await fetch('/api/music?'+new URLSearchParams({p,...params}));if(!r.ok)throw new Error(r.status);return r.json()}
function norm(s){
 const im=Array.isArray(s.image)?(s.image[s.image.length-1]||{}).url:s.image;
 const dl=Array.isArray(s.downloadUrl)?(s.downloadUrl[s.downloadUrl.length-1]||{}).url:(s.media_url||s.url);
 const o={id:String(s.id),title:dec(s.name||s.song||s.title),artist:dec(s.artists&&s.artists.primary?s.artists.primary.map(a=>a.name).join(', '):(s.primary_artists||s.singers||'')),img:(im||'').replace(/150x150|50x50/,'500x500'),url:dl,dur:+s.duration||0};
 C[o.id]=o;return o}
async function search(q,n=25){
 if(SC[q])return SC[q];
 for(const [p,k] of [['/api/search/songs',{query:q,limit:n}],['/result/',{query:q}]]){
  try{const j=await api(p,k),r=(j.data&&j.data.results)||j.data||j;
   if(Array.isArray(r)&&r.length){return SC[q]=r.map(norm)}}catch(e){}}
 return[]}
/* ---- helpers ---- */
const bg=c=>`background:linear-gradient(135deg,${c},#14120e)`;
function songRows(arr,ctx){lists[ctx]=arr;
 return arr.map((s,i)=>`<div class="song${Q[qi]&&Q[qi].id===s.id?' cur':''}" data-ctx="${ctx}" data-i="${i}"><span class="n">${i+1}</span><img class="th" src="${esc(s.img)}" alt="" loading="lazy"><div style="min-width:0"><div class="t">${esc(s.title)}</div><div class="a">${esc(s.artist)}</div></div><span class="d">${s.dur?fm(s.dur):''}</span><button class="ib ${isLiked(s.id)?'on':''}" data-like="${esc(s.id)}" aria-label="Like">${ic(isLiked(s.id)?'heart':'heartO')}</button></div>`).join('')}
const skel=n=>Array(n).fill('<div class="sk"></div>').join('');
const isLiked=id=>liked.some(s=>s.id===id);
/* ---- views ---- */
function home(){
 const h=new Date().getHours(),g=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
 main.innerHTML=`<h1>${g}</h1>
 <div class="chips"><span class="chip on">All</span><span class="chip">Music</span><span class="chip">Podcasts</span><span class="chip">Made for you</span></div>
 <div class="tiles"><a class="tile" href="#/library"><div class="th liked">${ic('heart')}</div>Liked Songs</a>${PL.slice(0,5).map(p=>`<a class="tile" href="#/list/${enc(p[0])}/${enc(p[1])}"><div class="th" style="${bg(p[2])}"></div>${p[0]}</a>`).join('')}</div>
 <h2>Made for you</h2><div class="scroll">${MIXES.map(m=>`<a class="mix" style="${bg(m[3])}" href="#/list/${enc(m[0])}/${enc(m[2])}">${m[0]}<small>${m[1]}</small></a>`).join('')}</div>
 <h2>Trending songs</h2><div id="trend">${skel(6)}</div>
 <h2>Browse</h2><div class="scroll">${GENRES.map(m=>`<a class="genre" style="${bg(m[2])}" href="#/list/${enc(m[0])}/${enc(m[1])}">${m[0]}</a>`).join('')}</div>
 <h2>Trending artists</h2><div class="scroll">${ARTISTS.map(a=>`<a class="art" href="#/list/${enc(a)}/${enc(a)}"><i>${a[0]}</i>${a}</a>`).join('')}</div>`;
 search('trending hindi songs',12).then(r=>{const e=$('#trend');if(e)e.innerHTML=r.length?songRows(r,'trend'):'<div class="msg">Songs load nahi hue. Check MUSIC_API_URL.</div>'})}
function searchV(q){
 main.innerHTML=`<h1>Search</h1><form class="sb" id="sf">${ic('search')}<input id="si" type="search" enterkeyhint="search" placeholder="What do you want to play?" value="${esc(q)}" autocomplete="off"></form><div id="sr">${q?skel(6):'<div class="msg">Song, artist ya album ka naam likho</div>'}</div>`;
 $('#sf').onsubmit=e=>{e.preventDefault();const v=$('#si').value.trim();if(v){$('#si').blur();location.hash='#/search/'+enc(v)}};
 if(q)search(q).then(r=>{const e=$('#sr');if(e)e.innerHTML=r.length?songRows(r,'sr'):'<div class="msg">Kuch nahi mila. Dusra naam try karo.</div>'});
 else if(!matchMedia('(max-width:800px)').matches)$('#si').focus()}
function listV(title,q){
 main.innerHTML=`<div class="head"><div class="ph" id="lh" style="${bg('#5a3a10')}"></div><div><h1 style="margin:0">${esc(title)}</h1><p id="lc">Loading...</p><a class="go" id="lp" href="#" style="display:none">${ic('play')}Play</a></div></div><div id="lr">${skel(8)}</div>`;
 search(q,30).then(r=>{if(!$('#lr'))return;
  $('#lr').innerHTML=r.length?songRows(r,'list'):'<div class="msg">Songs nahi mile.</div>';
  $('#lc').textContent=r.length+' songs';
  if(r.length){$('#lh').outerHTML=`<img id="lh" src="${esc(r[0].img)}" alt="">`;const b=$('#lp');b.style.display='inline-flex';b.onclick=e=>{e.preventDefault();play(r,0)}}})}
function library(){
 main.innerHTML=`<h1>Your Library</h1><div class="chips"><span class="chip on">Playlists</span><span class="chip">Artists</span><span class="chip">Albums</span></div>
 <h2>Liked Songs <span style="font-size:13px;color:var(--mut);font-weight:400">${liked.length} songs</span></h2>${liked.length?songRows(liked,'liked'):'<div class="msg">Kisi song ka heart dabao, yahan aa jayega.</div>'}
 <h2>Playlists</h2>${PL.map(p=>`<a class="pl" href="#/list/${enc(p[0])}/${enc(p[1])}"><div class="th" style="${bg(p[2])}"></div><div><b>${p[0]}</b><small>Playlist</small></div></a>`).join('')}`}
/* ---- router: hash based, so Back always stays inside Singify ---- */
function route(){
 const [v,a,b]=(location.hash.slice(2)||'home').split('/').map(decodeURIComponent);
 if(v==='now'){if(!Q[qi]){history.replaceState(null,'','#/home');return route()}document.body.classList.add('now');return}
 document.body.classList.remove('now');
 document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('on',x.dataset.nav===(v==='list'?'':v)));
 ({search:()=>searchV(a||''),list:()=>listV(a||'',b||a||''),library,home}[v]||home)();
 main.scrollTop=0}
addEventListener('hashchange',route);
/* ---- player ---- */
function load(){const s=Q[qi];if(!s)return;
 if(!s.url){toast('Is song ka link nahi mila, next chala raha hu');return next()}
 A.src=s.url;A.play().catch(()=>{});ui();
 if('mediaSession' in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:s.title,artist:s.artist,artwork:[{src:s.img,sizes:'500x500'}]});
  navigator.mediaSession.setActionHandler('nexttrack',next);navigator.mediaSession.setActionHandler('previoustrack',prev)}}
function play(list,i){Q=list;qi=i;load()}
function next(){if(!Q.length)return;qi=shuf?Math.floor(Math.random()*Q.length):(qi+1)%Q.length;load()}
function prev(){if(A.currentTime>3)A.currentTime=0;else if(Q.length){qi=(qi-1+Q.length)%Q.length;load()}}
A.onended=()=>rep?(A.currentTime=0,A.play()):next();
A.onerror=()=>{if(Q[qi]){toast('Song play nahi hua, next try kar raha hu');setTimeout(next,800)}};
const setR=(id,v)=>{const e=$(id);e.value=v;e.style.setProperty('--p',v/10+'%')};
A.ontimeupdate=()=>{const d=A.duration||0,v=d?A.currentTime/d*1000:0;['b','n'].forEach(p=>{setR('#'+p+'s',v);$('#'+p+'c').textContent=fm(A.currentTime);$('#'+p+'d').textContent=fm(d)})};
['bs','ns'].forEach(id=>$('#'+id).oninput=e=>{if(A.duration)A.currentTime=e.target.value/1000*A.duration});
A.onplay=A.onpause=()=>ppUI();
function ppUI(){['b','n'].forEach(p=>$('#'+p+'pp').innerHTML=ic(A.paused?'play':'pause'))}
function ui(){const s=Q[qi];if(!s)return;
 $('#bimg').src=$('#nimg').src=s.img;$('#bt').textContent=$('#nt').textContent=s.title;$('#ba').textContent=$('#na').textContent=s.artist;
 likeUI();ppUI();document.querySelectorAll('.song').forEach(r=>{const l=lists[r.dataset.ctx];r.classList.toggle('cur',!!l&&l[r.dataset.i].id===s.id)})}
function likeUI(){const s=Q[qi],on=s&&isLiked(s.id);['#blike','#nlike'].forEach(i=>{$(i).innerHTML=ic(on?'heart':'heartO');$(i).classList.toggle('on',!!on)})}
function toggleLike(id){const s=C[id];if(!s)return;
 liked=isLiked(id)?liked.filter(x=>x.id!==id):[s,...liked];
 try{localStorage.setItem('sg_liked',JSON.stringify(liked))}catch(e){}
 document.querySelectorAll(`[data-like="${CSS.escape(id)}"]`).forEach(b=>{b.classList.toggle('on',isLiked(id));b.innerHTML=ic(isLiked(id)?'heart':'heartO')});likeUI();
 if(location.hash==='#/library')library()}
/* ---- clicks ---- */
document.addEventListener('click',e=>{
 const l=e.target.closest('[data-like]');
 if(l){e.stopPropagation();return toggleLike(l.dataset.like==='cur'?(Q[qi]||{}).id:l.dataset.like)}
 const a=e.target.closest('[data-act]');
 if(a){const k=a.dataset.act;
  if(k==='pp'){if(!Q[qi])return toast('Pehle koi song chuno');A.paused?A.play():A.pause()}
  else if(k==='next')next();else if(k==='prev')prev();
  else if(k==='shuf'){shuf=!shuf;['#bshuf','#nshuf'].forEach(i=>$(i).classList.toggle('on',shuf))}
  else if(k==='rep'){rep=!rep;['#brep','#nrep'].forEach(i=>$(i).classList.toggle('on',rep))}
  else if(k==='open'){if(Q[qi])location.hash='#/now'}
  else if(k==='close')history.back();
  return}
 const r=e.target.closest('.song');
 if(r)play(lists[r.dataset.ctx],+r.dataset.i)});
/* ---- init ---- */
$('#sidepl').innerHTML=`<a class="pl" href="#/library"><div class="th liked">${ic('heart')}</div><div><b>Liked Songs</b><small>Your favourites</small></div></a>`+PL.slice(0,5).map(p=>`<a class="pl" href="#/list/${enc(p[0])}/${enc(p[1])}"><div class="th" style="${bg(p[2])}"></div><div><b>${p[0]}</b><small>Playlist</small></div></a>`).join('');
['#bshuf','#nshuf'].forEach(i=>$(i).innerHTML=ic('shuf'));['#brep','#nrep'].forEach(i=>$(i).innerHTML=ic('rep'));
document.querySelectorAll('[data-act=prev]').forEach(b=>b.innerHTML=ic('prev'));document.querySelectorAll('[data-act=next]').forEach(b=>b.innerHTML=ic('next'));
$('#nclose').innerHTML=ic('down');$('#blike').innerHTML=$('#nlike').innerHTML=ic('heartO');ppUI();
$('#t1 span').innerHTML=ic('home');$('#t2 span').innerHTML=ic('search');$('#t3 span').innerHTML=ic('lib');
route();
</script>
</body>
</html>
