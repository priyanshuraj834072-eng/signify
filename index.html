   try{r=await fetch(url,{signal:c.signal,headers:i===1?{}:await authHdr()})}finally{clearTimeout(t)}
   if(r.status===401){err=new Error('401');continue}                 /* old/expired login token: retry as a guest */
   if(r.status===404)throw Object.assign(new Error('404'),{final:1});
   if(r.status===429)throw Object.assign(new Error('Too many requests, please wait a moment'),{final:1});
