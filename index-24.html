<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0907">
<title>Singify</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0907;--panel:#100e0b;--card:#1a1712;--line:#2b2518;--gold:#f2b630;--gold2:#b8800f;--tx:#f5f0e6;--mut:#9b937f;--bar:84px;--nav:60px;--ease:cubic-bezier(.22,.8,.24,1)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:"Plus Jakarta Sans","Segoe UI",Roboto,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
body{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
input{user-select:text;-webkit-user-select:text}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;outline:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg{width:24px;height:24px;fill:currentColor;display:block}
.tp{transition:transform .25s var(--ease),background .25s,box-shadow .25s;cursor:pointer}
.tp:active{transform:scale(.96)}
@media(hover:hover){.card:hover,.mix:hover,.genre:hover,.tile:hover{transform:translateY(-3px)}.art:hover i{transform:scale(1.06)}}
@keyframes pg{from{opacity:0;transform:translateY(12px)}}
@keyframes rv{from{opacity:0;transform:translateY(16px) scale(.98)}}
@keyframes fi{from{opacity:.2}}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
@keyframes sk{to{background-position:-200%}}
@keyframes pop{40%{transform:scale(1.4)}}
.pg{animation:pg .45s var(--ease)}
.rv{animation:rv .55s var(--ease) backwards;animation-delay:calc(var(--d,0)*55ms)}
[data-q]{background-size:cover;background-position:center;background-color:var(--card)}
[data-q].ld{animation:fi .6s}
#app{display:grid;grid-template-columns:248px 1fr;height:100%;padding-bottom:var(--bar)}
#side{background:var(--panel);border-right:1px solid var(--line);padding:22px 14px;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:800;color:var(--gold);padding:0 10px 24px;letter-spacing:.3px}
.logo svg{width:34px;height:34px}
.nl{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:12px;color:var(--mut);font-weight:600;font-size:15px;margin-bottom:2px}
.nl:hover{color:var(--tx);background:#ffffff08}
.nl.on{background:linear-gradient(90deg,#4a350b,#1d1707);color:var(--tx);box-shadow:inset 0 0 0 1px #f2b63030}
.nl.on svg{color:var(--gold)}
.sh{margin:24px 14px 10px;font-size:11px;letter-spacing:1px;color:var(--mut);display:flex;justify-content:space-between}
.pl{display:flex;gap:12px;align-items:center;padding:8px;border-radius:12px}
.pl:hover{background:var(--card)}
.pl b{display:block;font-size:14px;font-weight:600}.pl small{color:var(--mut);font-size:12px}
.th{width:44px;height:44px;border-radius:9px;flex:none}
.liked{background:linear-gradient(135deg,#7a5cff,#3d2bd1)!important;display:grid;place-items:center;color:#fff}
.liked svg{width:22px;height:22px}
#col{display:flex;flex-direction:column;min-width:0;min-height:0}
#top{display:flex;align-items:center;gap:14px;padding:16px 28px 0}
.pill{flex:1;max-width:560px;display:flex;align-items:center;gap:10px;height:44px;padding:0 16px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--mut);font-size:14px}
.pill:hover{border-color:var(--gold2)}
.pill svg{width:20px;height:20px}.pill kbd{margin-left:auto;font:inherit;font-size:11px;border:1px solid var(--line);padding:2px 7px;border-radius:6px}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1204;display:grid;place-items:center;font-weight:800}
#main{flex:1;overflow:auto;padding:18px 28px 36px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{font-size:32px;font-weight:800;letter-spacing:-.5px}
h2{font-size:20px;font-weight:700;margin:30px 0 14px;display:flex;justify-content:space-between;align-items:baseline}
h2 a{font-size:13px;color:var(--gold);font-weight:600}
.prem{display:flex;align-items:center;gap:8px;border:1px solid var(--gold);color:var(--gold);padding:9px 20px;border-radius:99px;font-weight:700;font-size:14px}
.prem svg{width:18px;height:18px}.prem:hover{background:#f2b6301a}
.chips{display:flex;gap:10px;margin-bottom:20px;overflow:auto;scrollbar-width:none}
.chip{padding:8px 18px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;transition:all .3s var(--ease)}
.chip.on{background:var(--gold);color:#1a1204;border-color:var(--gold)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;overflow:hidden;padding-right:10px;min-width:0}
.tile .th{width:60px;height:60px;border-radius:0}
.tile b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile small{color:var(--mut);font-size:12px}.tile div:last-child{min-width:0}
.scroll{display:flex;gap:16px;overflow:auto;padding:4px 0 8px;scrollbar-width:none}
.card{flex:none;width:136px}
.card img{width:136px;height:136px;border-radius:12px;object-fit:cover;display:block;margin-bottom:9px;background:var(--card)}
.card b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card small{color:var(--mut);font-size:12px}
.mix{flex:none;width:300px;height:110px;border-radius:16px;position:relative;overflow:hidden;border:1px solid var(--line)}
.mix::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000d,#0004)}
.mix .mt{position:absolute;left:16px;bottom:14px;right:64px}.mix b{display:block;font-size:16px}.mix small{color:#fffa;font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gp{position:absolute;right:14px;bottom:14px;width:40px;height:40px;border-radius:50%;background:var(--gold);color:#1a1204;display:grid;place-items:center;box-shadow:0 6px 18px #f2b63055;transition:transform .3s var(--ease)}
.mix:hover .gp{transform:scale(1.12)}
.genre{flex:none;width:128px;height:128px;border-radius:14px;position:relative;overflow:hidden;border:1px solid #f2b63066;font-weight:700;font-size:15px}
.genre::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#000c,#0000 70%)}
.genre span{position:absolute;left:12px;bottom:10px}
.art{flex:none;width:100px;text-align:center;font-size:13px;font-weight:600}
.art i{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;font-size:34px;font-weight:800;font-style:normal;color:var(--gold);border:2px solid var(--gold2);margin-bottom:9px;transition:transform .35s var(--ease)}
.art i.ld{color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;column-gap:28px}
.song{display:grid;grid-template-columns:28px 48px 1fr auto 40px;gap:12px;align-items:center;padding:8px 8px;border-radius:12px}
.song:hover{background:var(--card)}
.song .n{color:var(--mut);text-align:center;font-size:14px;display:grid;place-items:center}
.song .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .a,.song .al,.song .d{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .x{min-width:0}.song .th{width:48px;height:48px;border-radius:8px;object-fit:cover}
.song.cur .t{color:var(--gold)}
.al{display:none}
.tbl .song{grid-template-columns:28px 48px 1.4fr 1fr 56px 40px}.tbl .al{display:block}
.tbh{display:grid;grid-template-columns:28px 48px 1.4fr 1fr 56px 40px;gap:12px;padding:10px 8px;border-bottom:1px solid var(--line);color:var(--mut);font-size:12px;letter-spacing:.8px;margin-bottom:6px}
.tbh span:nth-child(2){grid-column:2/4}.tbh svg{width:16px;height:16px}
.eq{display:none;gap:2px;align-items:flex-end;height:14px}
.eq b{width:3px;background:var(--gold);border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq b:nth-child(2){animation-delay:.2s}.eq b:nth-child(3){animation-delay:.4s}
.song.cur .n em{display:none}.song.cur .eq{display:flex}
body.paused .eq b{animation-play-state:paused}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--mut);transition:color .25s,transform .25s var(--ease),background .25s;flex:none}
.ib:hover{color:var(--tx)}.ib:active{transform:scale(.88)}
.ib.on{color:var(--gold)}.ib svg{width:22px;height:22px}
.ib.pop svg{animation:pop .4s var(--ease)}
.head{display:flex;gap:24px;align-items:flex-end;margin-bottom:22px}
.cv{width:190px;height:190px;border-radius:16px;flex:none;box-shadow:0 18px 50px #0009}
.head p{color:var(--mut);font-size:14px;margin-top:8px}
.acts{display:flex;align-items:center;gap:14px;margin-top:16px}
.go{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:#1a1204;font-weight:700;padding:11px 28px 11px 18px;border-radius:99px;box-shadow:0 8px 24px #f2b63040}
.go svg{width:20px;height:20px}
.sb{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:0 18px;height:48px;margin-bottom:20px;transition:border-color .3s}
.sb:focus-within{border-color:var(--gold)}
.sb input{flex:1;background:none;border:0;color:var(--tx);font:inherit;font-size:16px;outline:0;height:100%}
.msg{color:var(--mut);padding:30px 0;text-align:center;line-height:1.6}
.sk{height:60px;border-radius:12px;background:linear-gradient(90deg,var(--card),#26221a,var(--card));background-size:200%;animation:sk 1.3s infinite;margin-bottom:8px}
#bar{position:fixed;left:0;right:0;bottom:0;height:var(--bar);background:#0f0d0aee;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1.5fr 1fr;align-items:center;padding:0 20px;z-index:20}
#bar .info{display:flex;gap:12px;align-items:center;min-width:0;cursor:pointer}
#bar .info img{width:54px;height:54px;border-radius:10px;object-fit:cover;background:var(--card)}
#bar .info div{min-width:0}#bar .info b,#bar .info small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .info small{color:var(--mut)}
.ctl{display:flex;flex-direction:column;align-items:center;gap:4px}
.btns{display:flex;align-items:center;gap:10px}
.pp{width:46px;height:46px;border-radius:50%;background:var(--gold);color:#1a1204;display:grid;place-items:center;transition:transform .25s var(--ease),box-shadow .3s;box-shadow:0 6px 20px #f2b63040}
.pp:hover{transform:scale(1.07)}.pp:active{transform:scale(.92)}
.seek{display:flex;align-items:center;gap:10px;width:100%;max-width:560px;font-size:11px;color:var(--mut)}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--gold) var(--p,0%),#3a3426 var(--p,0%));outline:0;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--gold);transition:transform .2s}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.5)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--gold)}
#bar .r{display:flex;justify-content:flex-end}
#bp,#tabs{display:none}
#now{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 26px calc(22px + env(safe-area-inset-bottom));background:var(--bg);overflow:auto;transform:translateY(102%);visibility:hidden;transition:transform .55s var(--ease),visibility 0s .55s}
body.now #now{transform:none;visibility:visible;transition:transform .55s var(--ease)}
#now::before{content:"";position:absolute;inset:-20%;background:var(--cov) center/cover;filter:blur(70px) saturate(1.5);opacity:.4;z-index:-1;transition:background .6s}
#now>*{width:100%;max-width:400px}
#now .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);text-align:center}
#now .top div{flex:1}#now .top b{display:block;color:var(--tx);font-size:14px;margin-top:2px}
#nimg{aspect-ratio:1;border-radius:20px;object-fit:cover;margin:20px 0 22px;box-shadow:0 24px 70px #000b;background:var(--card);transition:transform .6s var(--ease)}
body.paused #nimg{transform:scale(.88)}
#now .meta{display:flex;justify-content:space-between;align-items:center}
#now .meta b{font-size:24px;display:block}#now .meta small{color:var(--mut);font-size:15px}
#now .seek{margin:18px 0 6px;max-width:400px}
#now .btns{justify-content:space-between;margin-top:8px}
#now .pp{width:70px;height:70px}#now .pp svg{width:34px;height:34px}
#now .btns .ib svg{width:27px;height:27px}
#toast{position:fixed;left:50%;bottom:calc(var(--bar) + 22px);transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#241f14;border:1px solid var(--gold2);padding:11px 20px;border-radius:99px;font-size:14px;z-index:60;transition:all .4s var(--ease);max-width:90%}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:800px){
 :root{--bar:62px}
 #app{grid-template-columns:1fr;padding-bottom:calc(var(--bar) + var(--nav) + 8px)}
 #side,#top,.prem,.tbh,.tbl .al{display:none}
 #main{padding:calc(14px + env(safe-area-inset-top)) 16px 20px}
 h1{font-size:26px}
 .tiles{grid-template-columns:1fr 1fr;gap:10px}.tile .th{width:52px;height:52px}
 .two{grid-template-columns:1fr}
 .mix{width:270px}
 .head{flex-direction:column;align-items:flex-start;gap:16px}.cv{width:160px;height:160px}
 .song,.tbl .song{grid-template-columns:48px 1fr 40px}.song .n,.song .d{display:none}
 #bar{bottom:calc(var(--nav) + 6px);left:8px;right:8px;grid-template-columns:1fr auto;border:1px solid var(--line);border-radius:16px;padding:0 8px 0 10px;background:#1a160eee;overflow:hidden}
 #bar .ctl{display:contents}#bar .seek,#bar .r,#bar .sec{display:none}
 #bar .info img{width:46px;height:46px}#bar .pp{width:40px;height:40px}
 #bar .btns{gap:2px}
 #bp{display:block;position:absolute;left:0;bottom:0;height:2px;background:var(--gold);width:0}
 #tabs{display:flex;position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#0d0b08f5;border-top:1px solid var(--line);z-index:30}
 #tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--mut);font-weight:600;transition:color .3s}
 #tabs a.on{color:var(--gold)}#tabs a.on svg{transform:translateY(-2px) scale(1.1)}#tabs svg{transition:transform .3s var(--ease)}
 #toast{bottom:calc(var(--bar) + var(--nav) + 24px)}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body class="paused">
<div id="app">
 <aside id="side">
  <div class="logo"><svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M4 17v0M9 11v12M14 5v24M19 9v16M24 13v8M29 15v4"/></svg>Singify</div>
  <a class="nl tp" data-nav="home" href="#/home"></a>
  <a class="nl tp" data-nav="search" href="#/search"></a>
  <a class="nl tp" data-nav="library" href="#/library"></a>
  <a class="nl tp" data-act="soon"></a>
  <a class="nl tp" data-act="soon"></a>
  <div class="sh"><span>YOUR PLAYLISTS</span><span>+</span></div>
  <div id="sidepl"></div>
 </aside>
 <div id="col">
  <header id="top"><a class="pill tp" href="#/search"></a><span style="flex:1"></span><button class="ib" data-act="soon" id="bell"></button><div class="av">S</div></header>
  <main id="main"></main>
 </div>
</div>
<footer id="bar">
 <i id="bp"></i>
 <div class="info" data-act="open"><img id="bimg" alt=""><div><b id="bt">Nothing playing</b><small id="ba">Pick a song</small></div></div>
 <div class="ctl">
  <div class="btns">
   <button class="ib sec" data-act="shuf" id="bshuf" aria-label="Shuffle"></button>
   <button class="ib" data-act="prev" aria-label="Previous"></button>
   <button class="pp" data-act="pp" id="bpp" aria-label="Play or pause"></button>
   <button class="ib" data-act="next" aria-label="Next"></button>
   <button class="ib sec" data-act="rep" id="brep" aria-label="Repeat"></button>
  </div>
  <div class="seek"><span id="bc">0:00</span><input type="range" min="0" max="1000" value="0" id="bs" aria-label="Seek"><span id="bd">0:00</span></div>
 </div>
 <div class="r"><button class="ib" data-like="cur" id="blike" aria-label="Like"></button></div>
</footer>
<nav id="tabs"><a data-nav="home" href="#/home"></a><a data-nav="search" href="#/search"></a><a data-nav="library" href="#/library"></a><a data-act="prem"></a></nav>
<section id="now">
 <div class="top"><button class="ib" data-act="close" id="nclose" aria-label="Close"></button><div>Playing from<b id="nfrom">Singify</b></div><span style="width:40px"></span></div>
 <img id="nimg" alt="">
 <div class="meta"><div><b id="nt"></b><small id="na"></small></div><button class="ib" data-like="cur" id="nlike" aria-label="Like"></button></div>
 <div class="seek"><span id="nc">0:00</span><input type="range" min="0" max="1000" value="0" id="ns" aria-label="Seek"><span id="nd">0:00</span></div>
 <div class="btns">
  <button class="ib" data-act="shuf" id="nshuf" aria-label="Shuffle"></button>
  <button class="ib" data-act="prev" aria-label="Previous"></button>
  <button class="pp" data-act="pp" id="npp" aria-label="Play or pause"></button>
  <button class="ib" data-act="next" aria-label="Next"></button>
  <button class="ib" data-act="rep" id="nrep" aria-label="Repeat"></button>
 </div>
</section>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),main=$('#main');
const IC={play:'M8 5v14l11-7z',pause:'M6 5h4v14H6zM14 5h4v14h-4z',next:'M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z',prev:'M6 6h2v12H6zM9.5 12l8.5 6V6z',heart:'M12 21l-1.4-1.3C5.4 15.1 2 12 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.5-3.4 6.6-8.6 11.2L12 21z',heartO:'M16.5 3c-1.7 0-3.4.8-4.5 2.1C10.9 3.8 9.2 3 7.5 3 4.4 3 2 5.4 2 8.5c0 3.5 3.4 6.6 8.6 11.2l1.4 1.3 1.4-1.3C18.6 15.1 22 12 22 8.5 22 5.4 19.6 3 16.5 3zm-4.4 15.6l-.1.1-.1-.1C7.1 14.2 4 11.4 4 8.5 4 6.5 5.5 5 7.5 5c1.5 0 3 1 3.6 2.4h1.8C13.5 6 15 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.9-3.1 5.7-7.9 10.1z',shuf:'M10.6 9.2L4 2.6 2.6 4l6.6 6.6 1.4-1.4zM14.5 4l2.5 2.5L2.6 20.9 4 22.3 18.4 7.9 21 10.5V4h-6.5zM14.8 13.4l-1.4 1.4 3.6 3.6L14.5 21H21v-6.5l-2.5 2.5-3.7-3.6z',rep:'M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z',home:'M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z',search:'M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z',lib:'M4 4h2v16H4zM8 4h2v16H8zM12.5 5.5l1.9-.5 4 15-1.9.5z',down:'M7 10l5 5 5-5z',dots:'M12 8a2 2 0 100-4 2 2 0 000 4zm0 2a2 2 0 100 4 2 2 0 000-4zm0 6a2 2 0 100 4 2 2 0 000-4z',bell:'M12 22a2 2 0 002-2h-4a2 2 0 002 2zm6-6V11c0-3.1-1.6-5.6-4.5-6.3V4a1.5 1.5 0 00-3 0v.7C7.7 5.4 6 7.9 6 11v5l-2 2v1h16v-1l-2-2z',clock:'M12 2a10 10 0 100 20 10 10 0 000-20zm0 18a8 8 0 110-16 8 8 0 010 16zm.5-13H11v6l5.2 3.2.8-1.3-4.5-2.7V7z',crown:'M5 16L3 6l5.5 4L12 4l3.5 6L21 6l-2 10H5zm0 2h14v2H5z',mic:'M12 14a3 3 0 003-3V5a3 3 0 00-6 0v6a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.9V21h2v-3.1A7 7 0 0019 11h-2z',cal:'M7 2v2H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2h-2V2h-2v2H9V2H7zm12 8v10H5V10h14z'};
const ic=n=>`<svg viewBox="0 0 24 24"><path d="${IC[n]}"/></svg>`;
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dec=t=>{const e=document.createElement('textarea');e.innerHTML=t||'';return e.value};
const fm=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const enc=encodeURIComponent,dl=i=>`style="--d:${Math.min(i,12)}"`;
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const PL=[['Chill Vibes','chill hindi songs','#2b3a67'],['Arijit Singh Mix','arijit singh','#4a3a12'],['Punjabi Hits','punjabi hits','#5c2a1a'],['Workout Mix','workout gym songs','#7a3b12'],['Road Trip','road trip hindi songs','#124a52'],['Atif Aslam Mix','atif aslam','#3a2a4a']];
const ARTISTS=['Arijit Singh','Atif Aslam','Shreya Ghoshal','Darshan Raval','Jubin Nautiyal','Pritam','Neha Kakkar','B Praak'];
const GENRES=[['Pop','english pop hits','#4b2a7a'],['Bollywood','bollywood hits','#6b3a0a'],['Punjabi','punjabi songs','#7a4a0a'],['Indie','indie hindi songs','#2a3a2a'],['Workout','workout songs','#6b2a0a'],['Chill','lofi chill songs','#1a3a5a']];
const MIXES=[['Daily Mix 1','Arijit Singh, Pritam, KK and more','arijit singh top songs','#5a3a10'],['Daily Mix 2','Shreya Ghoshal, Amit Trivedi and more','shreya ghoshal hits','#5a1f4a'],['Daily Mix 3','Darshan Raval, Jubin Nautiyal and more','darshan raval jubin nautiyal','#0f4a52']];
const DIRECT='https://saavnapi-nine.vercel.app'; // used only if /api/music is not working
let C={},lists={},liked=ls('sg_liked',[]),hist=ls('sg_hist',[]),Q=[],qi=-1,shuf=false,rep=false,VN='Singify',LE='',shown='';
const SPOS={},A=new Audio();A.preload='auto';
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2400)};
/* ---------- API ---------- */
async function api(p,params){
 try{const r=await fetch('/api/music?'+new URLSearchParams({p,...params}));if(r.ok)return await r.json()}catch(e){}
 const r=await fetch(DIRECT+p+'?'+new URLSearchParams(params));if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,80));return r.json()}
function norm(s){
 const im=Array.isArray(s.image)?(s.image[s.image.length-1]||{}).url:s.image;
 const u=Array.isArray(s.downloadUrl)?(s.downloadUrl[s.downloadUrl.length-1]||{}).url:(s.media_url||s.url);
 const al=s.album&&typeof s.album==='object'?s.album.name:s.album;
 const o={id:String(s.id),title:dec(s.name||s.song||s.title),artist:dec(s.artists&&s.artists.primary?s.artists.primary.map(a=>a.name).join(', '):(s.primary_artists||s.singers||'')),alb:dec(al),img:(im||'').replace(/150x150|50x50/,'500x500'),url:u,dur:+s.duration||0};
 C[o.id]=o;return o}
const SQ={};
function search(q){return SQ[q]||(SQ[q]=(async()=>{
 for(const [p,k] of [['/result/',{query:q,lyrics:'false'}],['/api/search/songs',{query:q,limit:30}]]){
  try{const j=await api(p,k),r=(j.data&&j.data.results)||j.data||j.results||j;
   if(Array.isArray(r)&&r.length)return r.map(norm);LE=p+' -> '+JSON.stringify(j).slice(0,100)}catch(e){LE=p+' -> '+e.message}}
 delete SQ[q];return[]})())}
const why=()=>LE?`<br><small style="font-size:12px;word-break:break-all">${esc(LE)}</small>`:'';
/* covers: elements with data-q get the first result's art (3 at a time) */
let cq=[],busy=0;
function covers(){$$('[data-q]:not([data-d])').forEach(e=>{e.dataset.d=1;cq.push(e)});pump()}
function pump(){while(busy<3&&cq.length){const e=cq.shift();if(!e.isConnected)continue;busy++;
 search(e.dataset.q).then(r=>{if(r[0]&&e.isConnected){e.style.backgroundImage=`url("${r[0].img}")`;e.classList.add('ld')}}).finally(()=>{busy--;pump()})}}
/* ---------- templates ---------- */
const bg=c=>`background:linear-gradient(135deg,${c},#14120e)`;
const href=(t,q)=>`#/list/${enc(t)}/${enc(q)}`;
const isLiked=id=>liked.some(s=>s.id===id);
const likeBtn=id=>`<button class="ib ${isLiked(id)?'on':''}" data-like="${esc(id)}" aria-label="Like">${ic(isLiked(id)?'heart':'heartO')}</button>`;
function songRows(arr,ctx){lists[ctx]=arr;
 return arr.map((s,i)=>`<div class="song tp rv${Q[qi]&&Q[qi].id===s.id?' cur':''}" ${dl(i)} data-ctx="${ctx}" data-i="${i}"><span class="n"><em>${i+1}</em><i class="eq"><b></b><b></b><b></b></i></span><img class="th" src="${esc(s.img)}" alt="" loading="lazy"><div class="x"><div class="t">${esc(s.title)}</div><div class="a">${esc(s.artist)}</div></div><span class="al">${esc(s.alb)}</span><span class="d">${s.dur?fm(s.dur):''}</span>${likeBtn(s.id)}</div>`).join('')}
const cards=(arr,ctx)=>{lists[ctx]=arr;return arr.map((s,i)=>`<div class="card tp rv" ${dl(i)} data-ctx="${ctx}" data-i="${i}"><img src="${esc(s.img)}" alt="" loading="lazy"><b>${esc(s.title)}</b><small>${esc(s.artist)}</small></div>`).join('')};
const skel=n=>Array(n).fill('<div class="sk"></div>').join('');
const plItem=(p,i)=>`<a class="pl tp" href="${href(p[0],p[1])}"><div class="th" data-q="${esc(p[1])}" style="${bg(p[2])}"></div><div><b>${p[0]}</b><small>Playlist</small></div></a>`;
/* ---------- views ---------- */
function home(){
 const h=new Date().getHours(),g=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
 main.innerHTML=`<div class="pg"><div class="hd"><h1>${g}</h1><button class="prem tp" data-act="prem">${ic('crown')}Explore Premium</button></div>
 <div class="chips"><span class="chip on">All</span><span class="chip">Music</span><span class="chip">Podcasts</span><span class="chip">Live Events</span><span class="chip">Made for you</span></div>
 <div class="tiles"><a class="tile tp rv" href="#/library"><div class="th liked">${ic('heart')}</div><div><b>Liked Songs</b><small>${liked.length} songs</small></div></a>${PL.slice(0,3).map((p,i)=>`<a class="tile tp rv" ${dl(i+1)} href="${href(p[0],p[1])}"><div class="th" data-q="${esc(p[1])}" style="${bg(p[2])}"></div><div><b>${p[0]}</b><small>Playlist</small></div></a>`).join('')}</div>
 <h2>Recently played</h2><div class="scroll" id="rp">${hist.length?cards(hist,'hist'):''}</div>
 <h2>Made for you</h2><div class="scroll">${MIXES.map((m,i)=>`<a class="mix tp rv" ${dl(i)} data-q="${esc(m[2])}" style="${bg(m[3])}" href="${href(m[0],m[2])}"><div class="mt"><b>${m[0]}</b><small>${m[1]}</small></div><span class="gp">${ic('play')}</span></a>`).join('')}</div>
 <h2>Trending songs</h2><div class="two" id="trend">${skel(6)}</div>
 <h2>Browse</h2><div class="scroll">${GENRES.map((m,i)=>`<a class="genre tp rv" ${dl(i)} data-q="${esc(m[1])}" style="${bg(m[2])}" href="${href(m[0],m[1])}"><span>${m[0]}</span></a>`).join('')}</div>
 <h2>Trending artists</h2><div class="scroll">${ARTISTS.map((a,i)=>`<a class="art tp rv" ${dl(i)} href="${href(a,a)}"><i data-q="${esc(a)}">${a[0]}</i>${a}</a>`).join('')}</div></div>`;
 search('trending hindi songs').then(r=>{const e=$('#trend');if(!e)return;
  e.innerHTML=r.length?songRows(r.slice(0,8),'trend'):`<div class="msg" style="grid-column:1/-1">Songs load nahi hue.${why()}</div>`;
  const rp=$('#rp');if(rp&&!rp.innerHTML.trim()&&r.length)rp.innerHTML=cards(r.slice(8,20).length?r.slice(8,20):r,'rpd')})}
function searchV(q){
 main.innerHTML=`<div class="pg"><h1 style="margin-bottom:16px">Search</h1><form class="sb" id="sf">${ic('search')}<input id="si" type="search" enterkeyhint="search" placeholder="What do you want to play?" value="${esc(q)}" autocomplete="off"></form><div id="sr">${q?skel(6):`<h2 style="margin-top:6px">Browse all</h2><div class="tiles">${GENRES.map((m,i)=>`<a class="genre tp rv" ${dl(i)} style="${bg(m[2])};width:auto" data-q="${esc(m[1])}" href="${href(m[0],m[1])}"><span>${m[0]}</span></a>`).join('')}</div>`}</div></div>`;
 $('#sf').onsubmit=e=>{e.preventDefault();const v=$('#si').value.trim();if(v){$('#si').blur();location.hash='#/search/'+enc(v)}};
 if(q)search(q).then(r=>{const e=$('#sr');if(e)e.innerHTML=r.length?`<div class="tbl">${songRows(r,'sr')}</div>`:`<div class="msg">Kuch nahi mila.${why()}</div>`});
 else if(!matchMedia('(max-width:800px)').matches)$('#si').focus()}
function listV(title,q){
 main.innerHTML=`<div class="pg"><div class="head"><div class="cv" id="cv" style="${bg('#5a3a10')}"></div><div><h1>${esc(title)}</h1><p>Aapka music, bina ads ke.</p><p id="lc">Loading...</p><div class="acts"><a class="go tp" id="lp" href="#" style="display:none">${ic('play')}Play</a></div></div></div>
 <div class="tbl"><div class="tbh"><span>#</span><span>TITLE</span><span>ALBUM</span><span>${ic('clock')}</span></div><div id="lr">${skel(8)}</div></div></div>`;
 search(q).then(r=>{if(!$('#lr'))return;
  $('#lr').innerHTML=r.length?songRows(r,'list'):`<div class="msg">Songs nahi mile.${why()}</div>`;
  if(!r.length){$('#lc').textContent='';return}
  const t=r.reduce((a,s)=>a+s.dur,0),m=Math.round(t/60);
  $('#lc').textContent=r.length+' songs'+(t?` • ${m>=60?Math.floor(m/60)+'h ':''}${m%60}m`:'');
  $('#cv').style.backgroundImage=`url("${r[0].img}")`;$('#cv').style.backgroundSize='cover';
  const b=$('#lp');b.style.display='inline-flex';b.onclick=e=>{e.preventDefault();play(r,0)}})}
function library(){
 main.innerHTML=`<div class="pg"><div class="hd"><h1>Your Library</h1></div><div class="chips"><span class="chip on">Playlists</span><span class="chip">Artists</span><span class="chip">Albums</span><span class="chip">Downloaded</span></div>
 ${PL.map(plItem).join('')}
 <h2>Liked Songs <a>${liked.length} songs</a></h2>${liked.length?`<div class="tbl">${songRows(liked,'liked')}</div>`:'<div class="msg">Kisi song ka heart dabao, wo yahan aa jayega.</div>'}</div>`}
/* ---------- router: hash based, Back always stays inside Singify ---------- */
function route(){
 const h=location.hash||'#/home',[v,a,b]=h.slice(2).split('/').map(decodeURIComponent);
 if(v==='now'){if(!Q[qi]){history.replaceState(null,'','#/home');return route()}document.body.classList.add('now');return}
 document.body.classList.remove('now');
 if(h===shown)return;
 SPOS[shown]=main.scrollTop;shown=h;
 $$('[data-nav]').forEach(x=>x.classList.toggle('on',x.dataset.nav===(v==='list'?'':v)));
 VN={search:'Search',list:a,library:'Liked Songs'}[v]||'Singify';
 ({search:()=>searchV(a||''),list:()=>listV(a||'',b||a||''),library,home}[v]||home)();
 covers();main.scrollTop=0;setTimeout(()=>{if(SPOS[h])main.scrollTop=SPOS[h]},60)}
addEventListener('hashchange',route);
/* ---------- player ---------- */
function load(){const s=Q[qi];if(!s)return;
 if(!s.url){toast('Is song ka link nahi mila, next chala raha hu');return next()}
 hist=[s,...hist.filter(x=>x.id!==s.id)].slice(0,12);sv('sg_hist',hist);
 A.src=s.url;A.play().catch(()=>{});ui();
 if('mediaSession' in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:s.title,artist:s.artist,artwork:[{src:s.img,sizes:'500x500'}]});
  navigator.mediaSession.setActionHandler('nexttrack',next);navigator.mediaSession.setActionHandler('previoustrack',prev)}}
function play(list,i){Q=list;qi=i;$('#nfrom').textContent=VN;load()}
function next(){if(!Q.length)return;qi=shuf?Math.floor(Math.random()*Q.length):(qi+1)%Q.length;load()}
function prev(){if(A.currentTime>3)A.currentTime=0;else if(Q.length){qi=(qi-1+Q.length)%Q.length;load()}}
A.onended=()=>rep?(A.currentTime=0,A.play()):next();
A.onerror=()=>{if(Q[qi]){toast('Song play nahi hua, next try kar raha hu');setTimeout(next,900)}};
const setR=(id,v)=>{const e=$(id);e.value=v;e.style.setProperty('--p',v/10+'%')};
A.ontimeupdate=()=>{const d=A.duration||0,v=d?A.currentTime/d*1000:0;['b','n'].forEach(p=>{setR('#'+p+'s',v);$('#'+p+'c').textContent=fm(A.currentTime);$('#'+p+'d').textContent=fm(d)});$('#bp').style.width=v/10+'%'};
['bs','ns'].forEach(id=>$('#'+id).oninput=e=>{if(A.duration)A.currentTime=e.target.value/1000*A.duration});
A.onplay=A.onpause=ppUI;
function ppUI(){['b','n'].forEach(p=>$('#'+p+'pp').innerHTML=ic(A.paused?'play':'pause'));document.body.classList.toggle('paused',A.paused)}
function ui(){const s=Q[qi];if(!s)return;
 $('#bimg').src=$('#nimg').src=s.img;$('#now').style.setProperty('--cov',`url("${s.img}")`);
 $('#bt').textContent=$('#nt').textContent=s.title;$('#ba').textContent=$('#na').textContent=s.artist;
 likeUI();ppUI();$$('[data-ctx].song').forEach(r=>{const l=lists[r.dataset.ctx];r.classList.toggle('cur',!!l&&l[r.dataset.i].id===s.id)})}
function likeUI(){const s=Q[qi],on=s&&isLiked(s.id);['#blike','#nlike'].forEach(i=>{$(i).innerHTML=ic(on?'heart':'heartO');$(i).classList.toggle('on',!!on)})}
function toggleLike(id){const s=C[id];if(!s)return;
 liked=isLiked(id)?liked.filter(x=>x.id!==id):[s,...liked];sv('sg_liked',liked);
 $$(`[data-like="${CSS.escape(id)}"]`).forEach(b=>{b.classList.toggle('on',isLiked(id));b.innerHTML=ic(isLiked(id)?'heart':'heartO');b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')});
 likeUI()}
/* ---------- clicks ---------- */
document.addEventListener('click',e=>{
 const l=e.target.closest('[data-like]');
 if(l){e.stopPropagation();return toggleLike(l.dataset.like==='cur'?(Q[qi]||{}).id:l.dataset.like)}
 const c=e.target.closest('.chip');
 if(c){c.parentNode.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));return}
 const a=e.target.closest('[data-act]');
 if(a){const k=a.dataset.act;
  if(k==='pp'){if(!Q[qi])return toast('Pehle koi song chuno');A.paused?A.play():A.pause()}
  else if(k==='next')next();else if(k==='prev')prev();
  else if(k==='shuf'){shuf=!shuf;['#bshuf','#nshuf'].forEach(i=>$(i).classList.toggle('on',shuf))}
  else if(k==='rep'){rep=!rep;['#brep','#nrep'].forEach(i=>$(i).classList.toggle('on',rep))}
  else if(k==='open'){if(Q[qi])location.hash='#/now'}
  else if(k==='close')history.back();
  else if(k==='prem')toast('Singify me sab free hai 😄');
  else if(k==='soon')toast('Ye jald aa raha hai');
  return}
 const r=e.target.closest('[data-ctx]');
 if(r)play(lists[r.dataset.ctx],+r.dataset.i)});
/* ---------- init ---------- */
const NAV=[['home','Home'],['search','Search'],['lib','Your Library'],['mic','Podcasts'],['cal','Live Events']];
$$('#side .nl').forEach((a,i)=>a.innerHTML=ic(NAV[i][0])+NAV[i][1]);
$$('#tabs a').forEach((a,i)=>a.innerHTML=ic(['home','search','lib','crown'][i])+['Home','Search','Your Library','Premium'][i]);
$('.pill').innerHTML=ic('search')+'What do you want to play?<kbd>Ctrl K</kbd>';$('#bell').innerHTML=ic('bell');
$('#sidepl').innerHTML=`<a class="pl tp" href="#/library"><div class="th liked">${ic('heart')}</div><div><b>Liked Songs</b><small>Your favourites</small></div></a>`+PL.slice(0,5).map(plItem).join('');
['#bshuf','#nshuf'].forEach(i=>$(i).innerHTML=ic('shuf'));['#brep','#nrep'].forEach(i=>$(i).innerHTML=ic('rep'));
$$('[data-act=prev]').forEach(b=>b.innerHTML=ic('prev'));$$('[data-act=next]').forEach(b=>b.innerHTML=ic('next'));
$('#nclose').innerHTML=ic('down');$('#blike').innerHTML=$('#nlike').innerHTML=ic('heartO');ppUI();
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();location.hash='#/search'}});
route();
</script>
</body>
</html>
