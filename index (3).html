<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0907"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Singify">
<title>Singify</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0907;--panel:#100e0b;--card:#1a1712;--line:#2b2518;--gold:#f2b630;--gold2:#b8800f;--tx:#f5f0e6;--mut:#9b937f;--bar:84px;--nav:60px;--ease:cubic-bezier(.22,.8,.24,1)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:"Plus Jakarta Sans","Segoe UI",Roboto,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
body{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
input{user-select:text;-webkit-user-select:text}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;outline:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg{width:24px;height:24px;fill:currentColor;display:block}
.tp{transition:transform .25s var(--ease),background .25s,box-shadow .25s;cursor:pointer}
.tp:active{transform:scale(.96)}
@media(hover:hover){.card:hover,.mix:hover,.genre:hover,.tile:hover{transform:translateY(-3px)}.art:hover i{transform:scale(1.06)}}
@keyframes pg{from{opacity:0;transform:translateY(12px)}}
@keyframes rv{from{opacity:0;transform:translateY(16px) scale(.98)}}
@keyframes fi{from{opacity:.2}}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
@keyframes sk{to{background-position:-200%}}
@keyframes pop{40%{transform:scale(1.4)}}
.pg{animation:pg .45s var(--ease)}
.rv{animation:rv .55s var(--ease) backwards;animation-delay:calc(var(--d,0)*55ms)}
[data-q]{background-size:cover;background-position:center;background-color:var(--card)}
[data-q].ld{animation:fi .6s}
#app{display:grid;grid-template-columns:248px 1fr;height:100%;padding-bottom:var(--bar)}
#side{background:var(--panel);border-right:1px solid var(--line);padding:22px 14px;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:800;color:var(--gold);padding:0 10px 24px;letter-spacing:.3px}
.logo svg{width:34px;height:34px}
.nl{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:12px;color:var(--mut);font-weight:600;font-size:15px;margin-bottom:2px}
.nl:hover{color:var(--tx);background:#ffffff08}
.nl.on{background:linear-gradient(90deg,#4a350b,#1d1707);color:var(--tx);box-shadow:inset 0 0 0 1px #f2b63030}
.nl.on svg{color:var(--gold)}
.sh{margin:24px 14px 10px;font-size:11px;letter-spacing:1px;color:var(--mut);display:flex;justify-content:space-between}
.pl{display:flex;gap:12px;align-items:center;padding:8px;border-radius:12px}
.pl:hover{background:var(--card)}
.pl b{display:block;font-size:14px;font-weight:600}.pl small{color:var(--mut);font-size:12px}
.th{width:44px;height:44px;border-radius:9px;flex:none}
.liked{background:linear-gradient(135deg,#7a5cff,#3d2bd1)!important;display:grid;place-items:center;color:#fff}
.liked svg{width:22px;height:22px}
#col{display:flex;flex-direction:column;min-width:0;min-height:0}
#top{display:flex;align-items:center;gap:14px;padding:16px 28px 0}
.pill{flex:1;max-width:560px;display:flex;align-items:center;gap:10px;height:44px;padding:0 16px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--mut);font-size:14px}
.pill:hover{border-color:var(--gold2)}
.pill svg{width:20px;height:20px}.pill kbd{margin-left:auto;font:inherit;font-size:11px;border:1px solid var(--line);padding:2px 7px;border-radius:6px}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1204;display:grid;place-items:center;font-weight:800}
#main{flex:1;overflow:auto;padding:18px 28px 36px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{font-size:32px;font-weight:800;letter-spacing:-.5px}
h2{font-size:20px;font-weight:700;margin:30px 0 14px;display:flex;justify-content:space-between;align-items:baseline}
h2 a{font-size:13px;color:var(--gold);font-weight:600}
.prem{display:flex;align-items:center;gap:8px;border:1px solid var(--gold);color:var(--gold);padding:9px 20px;border-radius:99px;font-weight:700;font-size:14px}
.prem svg{width:18px;height:18px}.prem:hover{background:#f2b6301a}
.chips{display:flex;gap:10px;margin-bottom:20px;overflow:auto;scrollbar-width:none}
.chip{padding:8px 18px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;transition:all .3s var(--ease)}
.chip.on{background:var(--gold);color:#1a1204;border-color:var(--gold)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;overflow:hidden;padding-right:10px;min-width:0}
.tile .th{width:60px;height:60px;border-radius:0}
.tile b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile small{color:var(--mut);font-size:12px}.tile div:last-child{min-width:0}
.scroll{display:flex;gap:16px;overflow:auto;padding:4px 0 8px;scrollbar-width:none}
.card{flex:none;width:136px}
.card img{width:136px;height:136px;border-radius:12px;object-fit:cover;display:block;margin-bottom:9px;background:var(--card)}
.card b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card small{color:var(--mut);font-size:12px}
.mix{flex:none;width:300px;height:110px;border-radius:16px;position:relative;overflow:hidden;border:1px solid var(--line)}
.mix::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000d,#0004)}
.mix .mt{position:absolute;left:16px;bottom:14px;right:64px}.mix b{display:block;font-size:16px}.mix small{color:#fffa;font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gp{position:absolute;right:14px;bottom:14px;width:40px;height:40px;border-radius:50%;background:var(--gold);color:#1a1204;display:grid;place-items:center;box-shadow:0 6px 18px #f2b63055;transition:transform .3s var(--ease)}
.mix:hover .gp{transform:scale(1.12)}
.genre{flex:none;width:128px;height:128px;border-radius:14px;position:relative;overflow:hidden;border:1px solid #f2b63066;font-weight:700;font-size:15px}
.genre::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#000c,#0000 70%)}
.genre span{position:absolute;left:12px;bottom:10px}
.art{flex:none;width:100px;text-align:center;font-size:13px;font-weight:600}
.art i{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;font-size:34px;font-weight:800;font-style:normal;color:var(--gold);border:2px solid var(--gold2);margin-bottom:9px;transition:transform .35s var(--ease)}
.art i.ld{color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;column-gap:28px}
.song{display:grid;grid-template-columns:28px 48px 1fr auto 84px;gap:12px;align-items:center;padding:8px 8px;border-radius:12px}
.song:hover{background:var(--card)}
.song .n{color:var(--mut);text-align:center;font-size:14px;display:grid;place-items:center}
.song .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .a,.song .al,.song .d{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .x{min-width:0}.song .th{width:48px;height:48px;border-radius:8px;object-fit:cover}
.song.cur .t{color:var(--gold)}
.al{display:none}
.tbl .song{grid-template-columns:28px 48px 1.4fr 1fr 56px 84px}.tbl .al{display:block}
.tbh{display:grid;grid-template-columns:28px 48px 1.4fr 1fr 56px 84px;gap:12px;padding:10px 8px;border-bottom:1px solid var(--line);color:var(--mut);font-size:12px;letter-spacing:.8px;margin-bottom:6px}
.tbh span:nth-child(2){grid-column:2/4}.tbh svg{width:16px;height:16px}
.eq{display:none;gap:2px;align-items:flex-end;height:14px}
.eq b{width:3px;background:var(--gold);border-radius:2px;animation:eq .9s ease-in-out infinite}
.eq b:nth-child(2){animation-delay:.2s}.eq b:nth-child(3){animation-delay:.4s}
.song.cur .n em{display:none}.song.cur .eq{display:flex}
body.paused .eq b{animation-play-state:paused}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--mut);transition:color .25s,transform .25s var(--ease),background .25s;flex:none}
.ib:hover{color:var(--tx)}.ib:active{transform:scale(.88)}
.ib.on{color:var(--gold)}.ib svg{width:22px;height:22px}
.ib.pop svg{animation:pop .4s var(--ease)}
.head{display:flex;gap:24px;align-items:flex-end;margin-bottom:22px}
.cv{width:190px;height:190px;border-radius:16px;flex:none;box-shadow:0 18px 50px #0009}
.head p{color:var(--mut);font-size:14px;margin-top:8px}
.acts{display:flex;align-items:center;gap:14px;margin-top:16px}
.go{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:#1a1204;font-weight:700;padding:11px 28px 11px 18px;border-radius:99px;box-shadow:0 8px 24px #f2b63040}
.go svg{width:20px;height:20px}
.sb{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:0 18px;height:48px;margin-bottom:20px;transition:border-color .3s}
.sb:focus-within{border-color:var(--gold)}
.sb input{flex:1;background:none;border:0;color:var(--tx);font:inherit;font-size:16px;outline:0;height:100%}
.msg{color:var(--mut);padding:30px 0;text-align:center;line-height:1.6}
.sk{height:60px;border-radius:12px;background:linear-gradient(90deg,var(--card),#26221a,var(--card));background-size:200%;animation:sk 1.3s infinite;margin-bottom:8px}
#bar{position:fixed;left:0;right:0;bottom:0;height:var(--bar);background:#0f0d0aee;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1.5fr 1fr;align-items:center;padding:0 20px;z-index:20}
#bar .info{display:flex;gap:12px;align-items:center;min-width:0;cursor:pointer}
#bar .info img{width:54px;height:54px;border-radius:10px;object-fit:cover;background:var(--card)}
#bar .info div{min-width:0}#bar .info b,#bar .info small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .info small{color:var(--mut)}
.ctl{display:flex;flex-direction:column;align-items:center;gap:4px}
.btns{display:flex;align-items:center;gap:10px}
.pp{width:46px;height:46px;border-radius:50%;background:var(--gold);color:#1a1204;display:grid;place-items:center;transition:transform .25s var(--ease),box-shadow .3s;box-shadow:0 6px 20px #f2b63040}
.pp:hover{transform:scale(1.07)}.pp:active{transform:scale(.92)}
.seek{display:flex;align-items:center;gap:10px;width:100%;max-width:560px;font-size:11px;color:var(--mut)}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--gold) var(--p,0%),#3a3426 var(--p,0%));outline:0;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--gold);transition:transform .2s}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.5)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--gold)}
#bar .r{display:flex;justify-content:flex-end}
#bp,#tabs{display:none}
#now{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 26px calc(22px + env(safe-area-inset-bottom));background:var(--bg);overflow:auto;transform:translateY(102%);visibility:hidden;transition:transform .55s var(--ease),visibility 0s .55s}
body.now #now{transform:none;visibility:visible;transition:transform .55s var(--ease)}
#now::before{content:"";position:absolute;inset:-20%;background:var(--cov) center/cover;filter:blur(70px) saturate(1.5);opacity:.4;z-index:-1;transition:background .6s}
#now>*{width:100%;max-width:400px}
#now .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);text-align:center}
#now .top div{flex:1}#now .top b{display:block;color:var(--tx);font-size:14px;margin-top:2px}
#nimg{aspect-ratio:1;border-radius:20px;object-fit:cover;margin:20px 0 22px;box-shadow:0 24px 70px #000b;background:var(--card);transition:transform .6s var(--ease)}
body.paused #nimg{transform:scale(.88)}
#now .meta{display:flex;justify-content:space-between;align-items:center}
#now .meta b{font-size:24px;display:block}#now .meta small{color:var(--mut);font-size:15px}
#now .seek{margin:18px 0 6px;max-width:400px}
#now .btns{justify-content:space-between;margin-top:8px}
#now .pp{width:70px;height:70px}#now .pp svg{width:34px;height:34px}
#now .btns .ib svg{width:27px;height:27px}
#toast{position:fixed;left:50%;bottom:calc(var(--bar) + 22px);transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#241f14;border:1px solid var(--gold2);padding:11px 20px;border-radius:99px;font-size:14px;z-index:60;transition:all .4s var(--ease);max-width:90%}
#toast.on{opacity:1;transform:translate(-50%,0)}
.rx{display:flex;justify-content:flex-end}.rx .ib{width:38px}
.sheet{position:fixed;inset:0;z-index:70;background:#000a;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.sheet.on{opacity:1;pointer-events:auto}
.sheet>div{width:100%;max-width:480px;max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(30px);transition:transform .35s var(--ease)}
.sheet.on>div{transform:none}.sheet h3{font-size:18px;margin-bottom:12px}
.si{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:12px;width:100%;text-align:left;font-weight:600}
.si:hover{background:var(--card)}.si small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.lyr{position:relative;width:100%;max-width:400px;margin:22px 0 10px;max-height:46vh;overflow:auto;scrollbar-width:none;padding:10px 0 24vh;-webkit-mask-image:linear-gradient(transparent,#000 10%,#000 80%,transparent);mask-image:linear-gradient(transparent,#000 10%,#000 80%,transparent)}
.lyr div{font-size:24px;font-weight:800;line-height:1.3;padding:8px 0;color:#ffffff55;transition:color .35s,transform .35s var(--ease);transform-origin:left;cursor:pointer}
.lyr div.on{color:var(--tx);transform:scale(1.04)}
.lyr.pl div{color:#ffffffcc;font-size:19px;font-weight:600;cursor:default}
.lyr .msg{font-size:15px;font-weight:500;color:var(--mut);text-align:left;padding:0}
#now .meta>div:first-child{min-width:0}#now .meta b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.stat b{font-size:26px;display:block;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat small{color:var(--mut)}
.prof{display:flex;gap:18px;align-items:center;margin-bottom:22px}.prof .av{width:76px;height:76px;font-size:32px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px}
.btn.g{background:var(--gold);color:#1a1204;border-color:var(--gold)}.btn svg{width:18px;height:18px}
.row2{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.af{padding:11px 4px;border-bottom:1px solid var(--line);font-size:14px}.af small{color:var(--mut);display:block;margin-top:2px}
h2 a{cursor:pointer}.art i[style]{background-size:cover;background-position:center}.art{margin-bottom:6px}
.pg[data-f=m] [data-s]:not([data-s~=m]),.pg[data-f=y] [data-s]:not([data-s~=y]){display:none}
.hero{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;scrollbar-width:none;border-radius:24px}
.hs{flex:none;width:100%;scroll-snap-align:center;position:relative;min-height:300px;border-radius:24px;overflow:hidden;background:var(--card) center/cover no-repeat;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;border:1px solid var(--line)}
.hs::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#000f 8%,#0004 75%)}.hs>*{position:relative}
.badge{align-self:flex-start;background:#0009;border:1px solid #fff3;padding:6px 12px;border-radius:99px;font-size:12px;font-weight:700;margin-bottom:auto}
.hs h3{font-size:28px;font-weight:800;line-height:1.1;margin-top:50px}.hs p{color:#ffffffc0;font-size:14px;margin:6px 0 14px}
.hb{display:flex;gap:10px;align-items:center}.hb .go{padding:11px 22px 11px 16px}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0 4px}.dots i{width:6px;height:6px;border-radius:99px;background:#fff3;transition:all .3s}.dots i.on{width:22px;background:var(--gold)}
.viz{display:flex;align-items:flex-end;justify-content:space-between;height:34px;margin:-6px 0 14px}
.viz i{flex:none;width:5px;height:100%;border-radius:3px;background:linear-gradient(0deg,var(--gold2),var(--gold));transform-origin:bottom;transform:scaleY(.12);animation:vz var(--t) ease-in-out infinite alternate;animation-delay:var(--dl)}
body.paused .viz i{animation:none}
@keyframes vz{from{transform:scaleY(.12)}to{transform:scaleY(var(--h))}}
@keyframes breathe{50%{transform:scale(1.025)}}
@keyframes glow{from{opacity:.28}to{opacity:.5}}
body:not(.paused) #nimg{animation:breathe 4s ease-in-out infinite}
body:not(.paused) #now::before{animation:glow 5s ease-in-out infinite alternate}
#bar .info{position:relative}
.mb{position:absolute;left:5px;bottom:5px;display:flex;gap:2px;align-items:flex-end;height:18px;background:#000b;padding:3px 4px;border-radius:6px;box-sizing:border-box}
.mb b{width:3px;background:var(--gold);border-radius:2px;animation:eq .9s ease-in-out infinite}.mb b:nth-child(2){animation-delay:.2s}.mb b:nth-child(3){animation-delay:.4s}
body.paused .mb b{animation-play-state:paused}
@media(max-width:800px){
 :root{--bar:62px}
 #app{grid-template-columns:1fr;padding-bottom:calc(var(--bar) + var(--nav) + env(safe-area-inset-bottom) + 8px)}
 #side,.prem,.pill,.tbh,.tbl .al{display:none}
 #top{padding:calc(10px + env(safe-area-inset-top)) 14px 0}
 #main{padding:8px 16px 20px}
 h1{font-size:26px}
 .tiles{grid-template-columns:1fr 1fr;gap:10px}.tile .th{width:52px;height:52px}
 .two{grid-template-columns:1fr}
 .mix{width:270px}
 .head{flex-direction:column;align-items:flex-start;gap:16px}.cv{width:160px;height:160px}
 .song,.tbl .song{grid-template-columns:48px 1fr 84px}.song .n,.song .d{display:none}
 #bar{bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 6px);left:8px;right:8px;grid-template-columns:1fr auto;border:1px solid var(--line);border-radius:16px;padding:0 8px 0 10px;background:#1a160eee;overflow:hidden}
 #bar .ctl{display:contents}#bar .seek,#bar .r,#bar .sec{display:none}
 #bar .info img{width:46px;height:46px}#bar .pp{width:40px;height:40px}
 #bar .btns{gap:2px}
 #bp{display:block;position:absolute;left:0;bottom:0;height:2px;background:var(--gold);width:0}
 #tabs{display:flex;position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#0d0b08f5;border-top:1px solid var(--line);z-index:30}
 #tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--mut);font-weight:600;transition:color .3s}
 #tabs a.on{color:var(--gold)}#tabs a.on svg{transform:translateY(-2px) scale(1.1)}#tabs svg{transition:transform .3s var(--ease)}
 #toast{bottom:calc(var(--bar) + var(--nav) + env(safe-area-inset-bottom) + 24px)}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body class="paused">

 ({search:()=>searchV(a||''),list:()=>listV(a||'',b||a||''),library,stage:stageV,ent:()=>listV(c||'',c||'',()=>entSongs(a,b,c)),pl:()=>plV(a),all:allV,home}[v]||home)();

function play(list,i){Q=list;qi=i;$('#nfrom').textContent=VN;load()}
function next(){if(!Q.length)return;qi=shuf?Math.floor(Math.random()*Q.length):(qi+1)%Q.length;load()}

 const c=e.target.closest('.chip');

{let ty=null,dy=0;const N=$('#now');
